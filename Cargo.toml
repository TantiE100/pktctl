[workspace]
resolver = "3"
members = ["crates/ptmp", "crates/pktfile", "crates/pktctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Santi E. <cbbe.santiago.echeverria.te@unifranz.edu.bo>"]
repository = "https://github.com/TantiE100/pktctl"
homepage = "https://github.com/TantiE100/pktctl"
keywords = ["packet-tracer", "cisco", "mcp", "networking"]
categories = ["network-programming", "simulation"]

[workspace.dependencies]
ptmp = { path = "crates/ptmp", version = "0.1.0" }
pktfile = { path = "crates/pktfile", version = "0.1.0" }
futures = "0.3"
md-5 = "0.11"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
